services:
  database:
    image: pgvector/pgvector:pg17
    container_name: ai_document_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: document_user
      POSTGRES_PASSWORD: document_password
      POSTGRES_DB: document_platform

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U document_user -d document_platform"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: