services:
  database:
    image: pgvector/pgvector:pg17
    container_name: ai_document_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: document_user
      POSTGRES_PASSWORD: document_password
      POSTGRES_DB: document_platform

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U document_user -d document_platform"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    container_name: ai_document_backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      database:
        condition: service_healthy

    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  postgres_data: