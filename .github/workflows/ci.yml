name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: document_user
          POSTGRES_PASSWORD: document_password
          POSTGRES_DB: document_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U document_user -d document_intelligence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      DEBUG: "false"

      DATABASE_URL: >-
        postgresql+psycopg://document_user:document_password@localhost:5432/document_intelligence_test

      JWT_SECRET_KEY: test_secret_key_for_github_actions
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"

      OPENAI_API_KEY: test-key

      UPLOAD_DIRECTORY: test_uploads
      MAX_UPLOAD_SIZE_MB: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable pgvector
        run: |
          PGPASSWORD=document_password \
          psql \
          -h localhost \
          -U document_user \
          -d document_intelligence_test \
          -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run backend tests
        run: pytest -v

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend build
        run: npm run build